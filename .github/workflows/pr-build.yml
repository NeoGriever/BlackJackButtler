name: BlackJackButtler Pull Request Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        shell: pwsh
        run: |
          $target = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -Force $archive $target

      - name: Restore solution
        run: dotnet restore BlackJackButtler.sln

      - name: Build solution
        run: dotnet build BlackJackButtler.sln -c Release --no-restore

      - name: Upload testing build
        uses: actions/upload-artifact@v4
        with:
          name: BlackJackButtler-testing-package
          path: BlackJackButtler/bin/Release/BlackJackButtler/latest.zip
          if-no-files-found: error
          retention-days: 7
